<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розыгрыш</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #0f0c0a;
            color: #fff;
            font-family: 'Press Start 2P', system-ui;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            padding: 15px;
            text-align: center;
            font-size: 18px;
            border-bottom: 4px solid #fff;
            box-shadow: 0 0 20px #ff00ff;
        }
        .ribbon-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: linear-gradient(45deg, #4a0e4a, #0a4a4a);
        }
        .track {
            display: flex;
            gap: 20px;
            animation: flyRight 25s linear infinite;
        }
        .card {
            width: 140px;
            height: 140px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        .card:hover {
            transform: scale(1.15) rotate(8deg);
        }
        .footer {
            background: #111;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            border-top: 4px solid #fff;
        }
        @keyframes flyRight {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .progress {
            height: 6px;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            animation: progress 15s linear infinite;
        }
    </style>
</head>
<body>
    <header>🔥 РОЗЫГРЫШИ 🔥</header>
    
    <div class="ribbon-container">
        <div class="progress"></div>
        <div class="track" id="track">
            <!-- Призы будут добавляться сюда через JS -->
        </div>
    </div>

    <div class="footer">
        <button id="participate" onclick="participate()" style="padding:12px 30px; font-size:16px; background:#00ff00; color:#000; border:none; border-radius:8px; cursor:pointer;">
            Я УЧАСТВУЮ!
        </button>
        <p style="margin-top:10px; font-size:12px;">Нажми кнопку — бот выберет победителя рандомно</p>
    </div>

    <script>
        // Для теста добавим 3 приза (в реальном боте будет динамика)
        const prizes = [
            { name: "Алмазы", img: "https://picsum.photos/id/1015/300/300" },
            { name: "Карты", img: "https://picsum.photos/id/201/300/300" },
            { name: "Про на акк", img: "https://picsum.photos/id/237/300/300" }
        ];

        function createPrizes() {
            const track = document.getElementById('track');
            track.innerHTML = '';
            prizes.forEach((prize, i) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <img src="\( {prize.img}" alt=" \){prize.name}">
                    <div style="font-size:12px; font-weight:bold;">${prize.name}</div>
                `;
                track.appendChild(div);
            });
        }

        function participate() {
            document.getElementById('participate').textContent = '🎉 ПОБЕДИТЕЛЬ ОПРЕДЕЛЁН!';
            document.getElementById('participate').style.background = '#ff00ff';
            
            // Для теста просто показываем случайного победителя
            const winners = ["@user1", "@user2", "@user3"];
            const winner = winners[Math.floor(Math.random() * winners.length)];
            
            alert(`🎉 ПОБЕДИТЕЛЬ: ${winner}!\n\nПоздравляем!`);
        }

        // Запуск
        window.onload = () => {
            createPrizes();
            
            // Автоматически обновляем ленту каждые 15 секунд (как в боте)
            setInterval(() => {
                createPrizes();
            }, 15000);
        };
    </script>
</body>
</html>
